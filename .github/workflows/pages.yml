# 紹介ページ、見本の仕様書（お店の例）、docs・skills の Markdown を HTML にした文書サイトを GitHub Pages に公開する。README のリンク先。
# 全体の版と、前の版（overseas_shop_before.geas）からの変更が出る版の 2 つを、そのとき生成する。
# 初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
name: pages

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tests/fixtures/overseas_shop/*.geas"
      - "tests/fixtures/overseas_shop/overseas_shop_plan.md"
      - "pages/**"
      - "docs/**"
      - "skills/**"
      - "tests/fixtures/overseas_shop/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 仕様書を生成する
        run: |
          F=tests/fixtures/overseas_shop
          mkdir -p site
          cargo run --release -q -p geas-cli -- review $F/overseas_shop.geas --plan $F/overseas_shop_plan.md \
            -o site/overseas_shop.html \
            --diff-o site/overseas_shop_changes.html \
            --base $F/overseas_shop_before.geas
          cp pages/index.html site/index.html
          mkdir -p site/en
          cp pages/index.en.html site/en/index.html
          cargo run --release -q -p geas-tools -- site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
