# PR と main への push で、テストを全部走らせる（python -m pytest tests）。
# 生成したアプリを cargo で組むテストは --offline で組むので、先に見本のアプリを生成して、依存の crate を取っておく。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 窓つき exe の試験（WebKitGTK・仮想ディスプレイ）と、常駐のトレイの部品
      - name: 窓の試験に要る部品を入れる
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev xvfb libxdo-dev libayatana-appindicator3-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ hashFiles('geas/server/Cargo.lock', 'geas/window/Cargo.lock') }}
      - name: 依存の crate を取っておく
        run: |
          for app in runtime_demo solo_tweet; do
            python -m geas rust tests/fixtures/$app/$app.geas -o "$RUNNER_TEMP/$app" --host --runtime --standalone
            (cd "$RUNNER_TEMP/$app/server" && cargo fetch)
            (cd "$RUNNER_TEMP/$app/window" && cargo fetch)
          done
      - name: テスト
        run: |
          python -m pip install -q pytest
          python -m pytest tests -q -rs
