[package]
name = "geas-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
sha2 = "0.10"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
include_dir = "0.7.4"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
