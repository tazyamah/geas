<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5c">
  <title>海外にも売るお店</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>海外にも売るお店</h1>
    <div class="who">
      <label>お客さま <select id="customer"></select></label>
      <span id="points" class="points"></span>
    </div>
  </header>
  <div id="offline" class="banner" hidden>オフラインです。つながるまで、注文はできません。</div>
  <div id="notice" class="banner info" hidden></div>
  <nav id="tabs">
    <button data-tab="products" class="on">商品</button>
    <button data-tab="cart">カート <span id="cart-count" class="badge"></span></button>
    <button data-tab="orders">注文</button>
    <button data-tab="test">テスト操作</button>
  </nav>
  <main>
    <section id="products" class="tab">
      <div class="currency" id="currency-switch" role="group" aria-label="通貨"></div>
      <div id="product-list" class="cards"></div>
    </section>
    <section id="cart" class="tab" hidden>
      <div id="cart-lines"></div>
      <form id="checkout" autocomplete="off">
        <h2>お届け先</h2>
        <label>国コード（2文字、例 JP・US）<input name="country" value="JP" maxlength="2" pattern="[A-Za-z]{2}" required></label>
        <label>郵便番号<input name="postal_code" value="100-0001" maxlength="10" required></label>
        <label>住所<input name="line" value="東京都千代田区千代田1-1" maxlength="80" required></label>
        <p class="hint">税と送料は、注文のときにお店が決めます。</p>
        <button type="submit" id="place">注文する</button>
      </form>
    </section>
    <section id="orders" class="tab" hidden>
      <div id="order-list"></div>
    </section>
    <section id="test" class="tab" hidden>
      <p class="hint">決済・倉庫・配送は模擬です。ここで、返事が来ない・在庫が足りないなどの状況を作れます。</p>
      <div class="panel">
        <label><input type="checkbox" id="t-drop"> 決済の返事を落とす（届かないまま）</label>
        <label><input type="checkbox" id="t-short"> 倉庫が在庫不足を返す</label>
        <label>請求を拒否する金額（最小単位）<input type="number" id="t-decline" min="1"></label>
        <label>返事までの秒数<input type="number" id="t-delay" min="0" max="600"></label>
        <button id="t-save">設定を反映</button>
      </div>
      <div class="panel">
        <button id="t-reconnect">つながりが戻った（出来事）</button>
        <button id="t-advance">時計を30分進める</button>
      </div>
      <h2>返事待ちの注文</h2><div id="t-waits"></div>
      <h2>外へ出した作用</h2><div id="t-effects"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
